# Isolated TabbyAPI config: EXL3 SC_2.00 target + its built-in MTP head as drafter.
network:
  host: 127.0.0.1
  port: 18120
  disable_auth: true
logging:
  log_prompt: false
  log_generation_params: false
model:
  model_dir: /path/to/models
  model_name: qwen38-exl3-2.0
  max_seq_len: 24576
  cache_size: 24576
  cache_mode: Q8
  chunk_size: 1024
  max_batch_size: 2
draft_model:
  draft_mode: mtp
  draft_cache_mode: Q8
  dynamic_draft: true
memory:
  sysmem_recurrent_cache: 16384
